name: NeuralPath CI/CD Pipeline

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Code Quality & Linting
        run: npm run lint

      - name: 5. Build Production Bundle
        run: npm run build

      - name: 6. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7. Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: neuralpath:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 8. Container Smoke Test
        run: |
          docker run -d --name smoke-test -p 8080:80 neuralpath:latest
          sleep 3
          curl -f http://localhost:8080/ || exit 1
          curl -f http://localhost:8080/stub_status || exit 1
          docker stop smoke-test
