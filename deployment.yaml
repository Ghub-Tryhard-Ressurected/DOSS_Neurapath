apiVersion: apps/v1
kind: Deployment

metadata:
  name: neuralpath
  labels:
    app: neuralpath

spec:
  replicas: 2

  selector:
    matchLabels:
      app: neuralpath

  template:
    metadata:
      labels:
        app: neuralpath

    spec:
      containers:
        - name: neuralpath
          image: neuralpath:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"